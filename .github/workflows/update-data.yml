# 지표 자동 수집 + GitHub Pages 배포
#  - 정해진 시간마다 FRED·Yahoo Finance·한국은행에서 데이터를 받아 data/latest.json 을 만들고
#    사이트 파일과 함께 GitHub Pages 에 배포합니다. (데이터는 저장소에 커밋하지 않음)
#  - 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 합니다.
#  - API 키: Settings → Secrets and variables → Actions → FRED_API_KEY, ECOS_API_KEY, EIA_API_KEY, GEMINI_API_KEY
#    (선택) TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — 긴급 경고를 텔레그램으로 받기
#  - AI 인사이트(Gemini)는 평일 아침 07:23 실행에서만 하루 1회 생성, 나머지 실행은 아침 해설을 그대로 유지
name: 데이터 수집 및 배포

on:
  push:
    branches: [main]
  schedule:
    # cron 은 UTC 기준. 한국시간 = UTC + 9
    - cron: '23 22 * * 0-4'   # 한국 07:23 (월~금) — 미국 장 마감 후, AI 인사이트 생성
    - cron: '43 7 * * 1-5'    # 한국 16:43 (월~금) — 한국 장 마감 후
    - cron: '13 13 * * 1-5'   # 한국 22:13 (월~금) — 미국 지표 발표(대개 21:30~23:00) 이후
    - cron: '23 22 * * 5'     # 한국 07:23 (토) — 금요일 미국 장 마감 반영 (데이터만, AI 없음)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      ai:
        description: 'AI 인사이트도 새로 생성 (Gemini 호출 1회)'
        type: boolean
        default: false
      telegram_test:
        description: '텔레그램 알림 연결 테스트 메시지 보내기'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      - name: 이전 배포 데이터 받기 (이번에 실패한 지표는 이전 값 유지)
        run: |
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/latest.json" -o previous.json || echo "이전 데이터 없음"
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/ai.json" -o ai-previous.json || echo "이전 AI 해설 없음"
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/alerts.json" -o alerts-previous.json || echo "이전 경고 기록 없음"

      - name: 지표 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/fetch-data.mjs --previous previous.json --out _site/data/latest.json

      - name: 긴급 경고 판단 (정제 가동률·하이일드 스프레드·VIX, 텔레그램 알림은 설정 시에만)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        run: node scripts/alerts.mjs --data _site/data/latest.json --out _site/data/alerts.json --previous alerts-previous.json

      - name: AI 인사이트 (Gemini, 평일 07:23 또는 수동 실행 때만)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          AI_RUN: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 22 * * 0-4') || (github.event_name == 'workflow_dispatch' && inputs.ai) }}
        run: node scripts/ai-insight.mjs --data _site/data/latest.json --out _site/data/ai.json --previous ai-previous.json

      - name: "사이트 파일 구성 (배포 버전 = 커밋 번호 + 시각)"
        run: |
          cp -r index.html data.js notes.js season.js manifest.json sw.js icons .nojekyll _site/
          BUILD="$(git rev-parse --short HEAD)-$(TZ=Asia/Seoul date +%m%d%H%M)"
          sed -i "s/__BUILD__/${BUILD}/g" _site/index.html _site/sw.js
          echo "배포 버전: ${BUILD}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # main 에서만 배포 (다른 브랜치 시험 실행은 수집·빌드까지만 확인 → 실패 메일 없음)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 공개 저장소는 60일간 활동이 없으면 예약 실행이 자동으로 꺼집니다.
  # 예약 실행 때마다 워크플로를 '활성화' API로 다시 켜 두어 멈추지 않게 합니다 (커밋 없음).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 예약 실행 유지
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
