# 코드 변경 검사 — PR 과 작업 브랜치 push 때 실행 (main 배포 전에 미리 확인)
#  · 단위 테스트: 계산 공식·지표 정의·AI 문장 검사·데이터 구조 검증·카탈로그 최신 여부
#  · 화면 스모크 테스트: 합성 데이터로 실제 브라우저에서 v1·v2 × 라이트·다크 화면, 모든 지표 상세, 공유 이미지, 백업·복원
name: 테스트

on:
  pull_request:
  push:
    branches-ignore: [main, v1-final]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest(26.04)에는 Playwright 1.56 이 브라우저를 설치하지 못함 — 지원 버전으로 고정
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true   # 보안 패치가 반영된 최신 22.x 를 받음 (러너에 미리 깔린 버전은 패치가 늦을 수 있음)
      - name: 단위 테스트
        # 파일을 직접 실행 (node --test 는 자식 프로세스 결과를 읽다 'Unable to deserialize cloned data' 로 가끔 죽음. 실패 시 종료 코드 1 은 같음)
        run: node tests/unit.test.mjs
      - name: 브라우저 설치 (Playwright)
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 화면 스모크 테스트
        run: node tests/ui-smoke.mjs
